name: 'Bee Lazy builds'

on:
  push:
    branches:
      - 'bee-lazy'
  workflow_dispatch:

env:
  QT_MIRROR: https://mirrors.ocf.berkeley.edu/qt/

jobs:
  Android:
    runs-on: ubuntu-24.04

    env:
      QT_VERSION: 6.10.3
      QT_MODULES: 'qtremoteobjects qt5compat qtimageformats qtshadertools'
      NDK_VERSION: 27.0.11718014
      ANDROID_PLATFORM: android-28
      APP_ANDROID_MIN_SDK: 28

    steps:
    - name: 'Free disk space'
      run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc /usr/local/share/boost

    - name: 'Get sources'
      uses: actions/checkout@v4
      with:
        submodules: 'true'

    - name: 'Install desktop Qt'
      uses: jurplel/install-qt-action@v4.3.1
      with:
        version: ${{ env.QT_VERSION }}
        host: 'linux'
        target: 'desktop'
        arch: 'linux_gcc_64'
        modules: ${{ env.QT_MODULES }}
        dir: ${{ runner.temp }}
        py7zrversion: '==0.22.*'
        extra: '--base ${{ env.QT_MIRROR }}'

    - name: 'Install android_arm64_v8a Qt'
      uses: jurplel/install-qt-action@v4.3.1
      with:
        version: ${{ env.QT_VERSION }}
        host: 'all_os'
        target: 'android'
        arch: 'android_arm64_v8a'
        modules: ${{ env.QT_MODULES }}
        dir: ${{ runner.temp }}
        py7zrversion: '==0.22.*'
        extra: '--base ${{ env.QT_MIRROR }}'

    - name: 'Install android_armv7 Qt'
      uses: jurplel/install-qt-action@v4.3.1
      with:
        version: ${{ env.QT_VERSION }}
        host: 'all_os'
        target: 'android'
        arch: 'android_armv7'
        modules: ${{ env.QT_MODULES }}
        dir: ${{ runner.temp }}
        py7zrversion: '==0.22.*'
        extra: '--base ${{ env.QT_MIRROR }}'

    - name: 'Setup Java'
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: 'Setup Android SDK'
      uses: android-actions/setup-android@v4
      with:
        packages: "platforms;${{ env.ANDROID_PLATFORM }} ndk;${{ env.NDK_VERSION }}"

    - name: 'Setup python'
      uses: actions/setup-python@v6
      with:
        python-version: 3.14

    - name: 'Install conan'
      run: pip install "conan==2.28.0"

    - name: 'Prepare signing key'
      env:
        KEYSTORE_BASE64: ${{ secrets.BEE_LAZY_ANDROID_KEYSTORE_BASE64 }}
        KEYSTORE_PASS: ${{ secrets.BEE_LAZY_ANDROID_KEYSTORE_PASS }}
      shell: bash
      run: |
        if [[ -n "$KEYSTORE_BASE64" ]]; then
          echo "$KEYSTORE_BASE64" | base64 --decode > android.keystore
          echo "QT_ANDROID_KEYSTORE_STORE_PASS=$KEYSTORE_PASS" >> "$GITHUB_ENV"
        else
          echo "::warning::BEE_LAZY_ANDROID_KEYSTORE_BASE64 is not set, the APK is signed with a one-off key and will not update over a previous install"
          pass=$(openssl rand -hex 16)
          echo "::add-mask::$pass"
          keytool -genkeypair -keystore android.keystore -storetype PKCS12 -alias beelazy \
            -keyalg RSA -keysize 4096 -validity 10000 -dname "CN=Bee Lazy" \
            -storepass "$pass" -keypass "$pass"
          echo "QT_ANDROID_KEYSTORE_STORE_PASS=$pass" >> "$GITHUB_ENV"
        fi
        echo "QT_ANDROID_KEYSTORE_PATH=$GITHUB_WORKSPACE/android.keystore" >> "$GITHUB_ENV"
        echo "QT_ANDROID_KEYSTORE_ALIAS=beelazy" >> "$GITHUB_ENV"

    - name: 'Build APK'
      env:
        QT_INSTALL_DIR: ${{ runner.temp }}
      shell: bash
      run: |
        OUT=deploy/artifacts
        mkdir -p $OUT
        for abi in arm64-v8a armeabi-v7a; do
          deploy/build.sh -t android --sign --abi ${abi} --build ./deploy/build/${abi}
          VERSION=$(grep CMAKE_PROJECT_VERSION:STATIC deploy/build/${abi}/CMakeCache.txt | cut -d= -f2)
          mv deploy/build/${abi}/client/android-build/AmneziaVPN.apk $OUT/BeeLazy_${VERSION}_android_${abi}.apk
        done
        ls -l $OUT

    - name: 'Upload APK'
      uses: actions/upload-artifact@v7
      with:
        name: BeeLazy-android
        path: deploy/artifacts/*.apk
        retention-days: 30

  Windows:
    runs-on: windows-latest

    env:
      QT_VERSION: 6.10.1

    steps:
    - name: 'Get sources'
      uses: actions/checkout@v4
      with:
        submodules: 'true'

    - name: 'Install Qt'
      uses: jurplel/install-qt-action@v3
      with:
        version: ${{ env.QT_VERSION }}
        host: 'windows'
        target: 'desktop'
        arch: 'win64_msvc2022_64'
        modules: 'qtremoteobjects qt5compat qtshadertools qthttpserver qtwebsockets'
        dir: ${{ runner.temp }}
        setup-python: 'true'
        tools: 'tools_ifw'
        set-env: 'true'
        aqtversion: '==3.3.0'
        py7zrversion: '==0.22.*'
        extra: '--base ${{ env.QT_MIRROR }}'

    - name: 'Setup mvsc'
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: 'x64'

    - name: 'Setup .NET SDK'
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: 'Install WiX Toolset'
      shell: powershell
      run: |
        dotnet tool install --global wix --version 4.0.6
        wix extension add -g WixToolset.UI.wixext/4.0.6
        wix extension add -g WixToolset.Util.wixext/4.0.6
        $wixBinDir = Join-Path $env:USERPROFILE ".dotnet\tools"
        echo "WIX_BIN_DIR=$wixBinDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

    - name: 'Setup python'
      uses: actions/setup-python@v6
      with:
        python-version: 3.14

    - name: 'Install conan'
      run: pip install "conan==2.28.0"

    - name: 'Build installers'
      shell: cmd
      env:
        QT_INSTALL_DIR: ${{ runner.temp }}
      run: |
        set WIX_ROOT_PATH="${{ env.USERPROFILE }}\.dotnet\tools"
        deploy\build.bat --installer all

    - name: 'Upload installers'
      uses: actions/upload-artifact@v7
      with:
        name: BeeLazy-windows
        path: |
          deploy/build/BeeLazy_*_windows_x64.msi
          deploy/build/BeeLazy_*_windows_x64.exe
        retention-days: 30

  MacOS:
    runs-on: macos-26

    env:
      QT_VERSION: 6.10.1

    steps:
    - name: 'Get sources'
      uses: actions/checkout@v4
      with:
        submodules: 'true'

    - name: 'Setup xcode'
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '26.3.0'

    - name: 'Install Qt'
      uses: jurplel/install-qt-action@v4.3.1
      with:
        version: ${{ env.QT_VERSION }}
        host: 'mac'
        target: 'desktop'
        arch: 'clang_64'
        modules: 'qtremoteobjects qt5compat qtshadertools qthttpserver qtwebsockets'
        dir: ${{ runner.temp }}
        setup-python: 'true'
        set-env: 'true'
        aqtversion: '==3.3.0'
        py7zrversion: '==0.22.*'
        extra: '--base ${{ env.QT_MIRROR }}'

    - name: 'Setup python'
      uses: actions/setup-python@v6
      with:
        python-version: 3.14

    - name: 'Install conan'
      run: pip install "conan==2.28.0"

    - name: 'Build installer'
      env:
        QT_INSTALL_DIR: ${{ runner.temp }}
      shell: bash
      run: deploy/build.sh --generator Ninja --installer all

    - name: 'Upload installer'
      uses: actions/upload-artifact@v7
      with:
        name: BeeLazy-macos
        path: deploy/build/BeeLazy_*_macos_x64.pkg
        retention-days: 30
